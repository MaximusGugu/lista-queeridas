<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/MaximusGugu/lista-queeridas/refs/heads/main/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MaximusGugu/lista-queeridas/refs/heads/main/favicon.png" />
    <title>Queeridas - Criador de Stories</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260903-2">
    <script src="standalone-navigation.js" defer></script>
</head>
<body class="theme-todes">
    <header class="header-compact">
        <div class="container center-header">
            <h1>CRIADOR DE STORIES</h1>
        </div>
    </header>

    <main class="container story-page">
        <div class="nota-selector story-mode-selector" id="storyModeSelector" aria-label="Modalidade">
            <button type="button" class="nota-option story-mode-option active" data-mode="todes" aria-pressed="true">Todes</button>
            <button type="button" class="nota-option story-mode-option" data-mode="allstars" aria-pressed="false">All Stars</button>
            <button type="button" class="nota-option story-mode-option" data-mode="elax" aria-pressed="false">Elax</button>
        </div>

        <div class="story-upload-row">
            <button type="button" id="btnStoryPhoto" class="btn btn-main">SELECIONAR FOTO</button>
            <button type="button" id="btnStoryReset" class="story-icon-button" aria-label="Restaurar enquadramento" title="Restaurar enquadramento" disabled>&#8634;</button>
            <input type="file" id="storyPhotoInput" class="hidden" accept="image/*">
        </div>

        <div class="story-canvas-shell" id="storyCanvasShell">
            <canvas id="storyCanvas" width="1080" height="1920" aria-label="Prévia do story"></canvas>
            <div id="storyEmptyState" class="story-empty-state">SELECIONE UMA FOTO</div>
        </div>

        <div class="story-zoom-control">
            <label for="storyZoom">Zoom</label>
            <input type="range" id="storyZoom" min="0.25" max="3" step="0.01" value="1" disabled>
        </div>

        <p id="storyStatus" class="story-status" aria-live="polite"></p>

        <div class="story-export-actions">
            <button type="button" id="btnStoryShare" class="btn btn-main btn-primary-praia" disabled>COMPARTILHAR / SALVAR</button>
            <button type="button" id="btnStoryDownload" class="btn btn-sub" disabled>BAIXAR PNG</button>
        </div>
    </main>

    <script type="module" src="story.js?v=20260903-7"></script>
    <script type="module" src="load-navbar.js?v=20260903-2"></script>
</body>
</html>
